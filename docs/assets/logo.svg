<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Accent Line Gradients -->
    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="200" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Subtle Network Grid Background -->
  <g stroke="#374151" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="160" y1="0" x2="160" y2="200" />
    <line x1="320" y1="0" x2="320" y2="200" />
    <line x1="480" y1="0" x2="480" y2="200" />
    <line x1="640" y1="0" x2="640" y2="200" />
  </g>

  <!-- Connecting Node Waveform in Background -->
  <path d="M 60 100 Q 110 50, 160 100 T 260 100 T 360 100 T 460 100 T 560 100 T 660 100 T 740 100" 
        fill="none" stroke="url(#pulseCyan)" stroke-width="2" opacity="0.3" stroke-dasharray="4 6" />

  <!-- ICON BADGE (Left) -->
  <g transform="translate(60, 40)">
    <!-- Outer Hex / Rounded Diamond -->
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#131C2E" stroke="#2563EB" stroke-width="2" filter="url(#glow)" />
    
    <!-- Inner Accent Nodes & Path -->
    <!-- Network Nodes -->
    <path d="M 30 60 L 60 30 L 90 60 L 60 90 Z" fill="none" stroke="url(#iconGrad)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Central Pulse -->
    <circle cx="60" cy="60" r="14" fill="url(#iconGrad)" filter="url(#softGlow)" />
    <circle cx="60" cy="60" r="6" fill="#FFFFFF" />

    <!-- Satellite Nodes -->
    <circle cx="30" cy="60" r="5" fill="#38BDF8" />
    <circle cx="60" cy="30" r="5" fill="#3B82F6" />
    <circle cx="90" cy="60" r="5" fill="#8B5CF6" />
    <circle cx="60" cy="90" r="5" fill="#06B6D4" />

    <!-- Pulse Tracer Lines -->
    <line x1="15" y1="60" x2="30" y2="60" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="90" y1="60" x2="105" y2="60" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY / LOGO TEXT -->
  <g transform="translate(215, 60)">
    <!-- Main Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="54" font-weight="900" letter-spacing="4" fill="#FFFFFF">
      TRACE
      <tspan fill="#38BDF8" font-size="28" font-weight="700" dx="8" dy="-20">2.0</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="16" font-weight="500" letter-spacing="1.5" fill="#94A3B8">
      API TESTING &amp; NETWORK ANALYSIS PLATFORM
    </text>

    <!-- Status Badges in Logo -->
    <g transform="translate(2, 102)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="85" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="42.5" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8" text-anchor="middle">FASTAPI</text>
      
      <!-- Badge 2 -->
      <rect x="95" y="0" width="85" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="137.5" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#60A5FA" text-anchor="middle">REACT 19</text>

      <!-- Badge 3 -->
      <rect x="190" y="0" width="105" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="242.5" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#A78BFA" text-anchor="middle">DNS + TIMING</text>
      
      <!-- Badge 4 -->
      <rect x="305" y="0" width="130" height="20" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <circle cx="316" cy="10" r="3.5" fill="#34D399" />
      <text x="375" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#A7F3D0" text-anchor="middle">SSRF PROTECTED</text>
    </g>
  </g>
</svg>
